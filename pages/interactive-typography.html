  <style>
    .content-page {
      background: #20003b;
      color: #a18100;
    }

    .content-page h2 {
      color: #d4b800;
    }

    .content-page p {
      color: #a18100;
    }

    .carousel {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 12px;
    }

    .carousel-slides {
      display: flex;
      justify-content: center;
      flex: 1;
      overflow: hidden;
    }

    .carousel-slide {
      display: none;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .carousel-slide.active {
      display: flex;
    }

    .carousel-slide iframe {
      width: 600px;
      height: 600px;
      border: none;
      flex-shrink: 0;
    }

    .carousel-label {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      font-family: "pixelify-sans", sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: #a18100;
      text-transform: uppercase;
      white-space: nowrap;
      min-width: 18px;
    }

    .carousel-btn {
      background: none;
      border: 2px solid #a18100;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #a18100;
      flex-shrink: 0;
      font-size: 16px;
      transition: background 0.2s, color 0.2s;
      margin: 0 8px;
    }

    .carousel-btn:hover {
      background: #a18100;
      color: #20003b;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .carousel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a18100;
      opacity: 0.3;
      cursor: pointer;
      border: none;
    }

    .carousel-dot.active {
      opacity: 1;
    }

    .proto-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      justify-content: center;
      margin-bottom: 32px;
      padding: 0 5%;
    }

    .proto-grid iframe {
      width: 100%;
      aspect-ratio: 1;
      border: none;
    }
  </style>
</head>
<body>

  <script>
    let current = 0;
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.carousel-dot');

    function goToSlide(n) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = (n + slides.length) % slides.length;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    function moveCarousel(dir) {
      goToSlide(current + dir);
    }
  </script>
